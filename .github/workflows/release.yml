name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate build info
        run: |
          cat > Sources/WebMux/BuildInfo.swift << SWIFT
          // Auto-generated
          enum BuildInfo {
              static let version = "${GITHUB_REF_NAME#v}"
              static let buildDate = "$(date '+%Y-%m-%d')"
          }
          SWIFT

      - name: Build release binary
        run: swift build -c release

      - name: Create app bundle
        run: |
          APP="WebMux.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          BIN=".build/release/WebMux"
          [ -f "$BIN" ] || BIN=".build/arm64-apple-macosx/release/WebMux"
          cp "$BIN" "$APP/Contents/MacOS/WebMux"
          [ -f AppIcon.icns ] && cp AppIcon.icns "$APP/Contents/Resources/"

          cat > "$APP/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>WebMux</string>
            <key>CFBundleIdentifier</key><string>com.webmux.app</string>
            <key>CFBundleName</key><string>WebMux</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSAppTransportSecurity</key>
            <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
            <key>NSCameraUsageDescription</key><string>Web apps in WebMux use the camera for video calls.</string>
            <key>NSMicrophoneUsageDescription</key><string>Web apps in WebMux use the microphone for calls and voice messages.</string>
          </dict>
          </plist>
          EOF

      - name: Ad-hoc code sign
        run: codesign --force --deep --sign - --entitlements WebMux.entitlements WebMux.app

      - name: Zip app bundle
        run: zip -r "WebMux-${GITHUB_REF_NAME}.zip" WebMux.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: WebMux-*.zip
          generate_release_notes: true
