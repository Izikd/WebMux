<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7"/>
      <stop offset="100%" style="stop-color:#0984E3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#shine)"/>

  <!-- Sidebar strip -->
  <rect x="72" y="96" width="80" height="320" rx="16" ry="16" fill="rgba(255,255,255,0.2)"/>

  <!-- Sidebar dots (services) -->
  <circle cx="112" cy="156" r="18" fill="rgba(255,255,255,0.9)"/>
  <circle cx="112" cy="216" r="18" fill="rgba(255,255,255,0.55)"/>
  <circle cx="112" cy="276" r="18" fill="rgba(255,255,255,0.55)"/>
  <circle cx="112" cy="336" r="18" fill="rgba(255,255,255,0.55)"/>

  <!-- Main content area -->
  <rect x="176" y="96" width="264" height="320" rx="16" ry="16" fill="rgba(255,255,255,0.95)"/>

  <!-- Globe/web icon in content area -->
  <g transform="translate(308, 256)">
    <!-- Globe circle -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#6C5CE7" stroke-width="6"/>
    <!-- Horizontal lines -->
    <ellipse cx="0" cy="0" rx="72" ry="28" fill="none" stroke="#6C5CE7" stroke-width="4"/>
    <!-- Vertical meridian -->
    <ellipse cx="0" cy="0" rx="28" ry="72" fill="none" stroke="#6C5CE7" stroke-width="4"/>
    <!-- Equator -->
    <line x1="-72" y1="0" x2="72" y2="0" stroke="#6C5CE7" stroke-width="4"/>
    <!-- Prime meridian -->
    <line x1="0" y1="-72" x2="0" y2="72" stroke="#6C5CE7" stroke-width="4"/>
  </g>

  <!-- Connection lines from active dot to content -->
  <line x1="130" y1="156" x2="176" y2="156" stroke="rgba(255,255,255,0.7)" stroke-width="3"/>
</svg>
